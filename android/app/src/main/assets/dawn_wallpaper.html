        /**
         * Mid-latitude (CN ~30–40°N) civil dusk/dawn — northern hemisphere.
         * Summer: deepen starts ~19:00, deep by ~22:30, dawn lift ~04:30→07:00.
         * Winter: deepen starts ~16:30 (still afternoon), deep by ~19:30,
         *         dawn stays dark until ~07:00 and only reaches day-blue ~09:00.
         * Shoulder (Mar–Apr / Sep–Oct): between the two.
         */
        function seasonSkyWindows(month) {
            var m = month || (new Date().getMonth() + 1);
            if (m >= 5 && m <= 8) {
                return { dusk0: 19, dusk1: 22.5, dawn0: 4.5, dawn1: 7 };
            }
            if (m === 11 || m === 12 || m <= 2) {
                return { dusk0: 16.5, dusk1: 19.5, dawn0: 6.5, dawn1: 9 };
            }
            return { dusk0: 17.5, dusk1: 21, dawn0: 5.5, dawn1: 8 };
        }

        /** 1 = full day blue, 0 = deepest night. Continuous across dusk → night → dawn. */
        function skyBrightness(hour, month) {
            var w = seasonSkyWindows(month);
            // Sample mid-hour so e.g. summer 19:00 already starts dipping (not still full day).
            var h = ((Number(hour) % 24) + 24) % 24 + 0.5;
            if (h >= w.dawn1 && h < w.dusk0) return 1;
            if (h >= w.dusk0 && h < w.dusk1) {
                return 1 - (h - w.dusk0) / (w.dusk1 - w.dusk0);
            }
            if (h >= w.dawn0 && h < w.dawn1) {
                return (h - w.dawn0) / (w.dawn1 - w.dawn0);
            }
            return 0;
        }

        function conditionDayRgb(condition) {
            var c = String(condition || '').toLowerCase().replace(/_/g, '-');
            // Night condition names still resolve to the daytime palette endpoint.
            if (c.indexOf('night') >= 0) {
                if (c.indexOf('partly') >= 0) return SKY_DAY_RGB.partlycloudy;
                if (c.indexOf('cloud') >= 0) return SKY_DAY_RGB.cloudy;
                return SKY_DAY_RGB.sunny;
            }
            if (c.indexOf('snow') >= 0) return SKY_DAY_RGB.snowy;
            if (c.indexOf('rain') >= 0 || c.indexOf('pour') >= 0 ||
                c.indexOf('lightning') >= 0 || c.indexOf('hail') >= 0) {
                return SKY_DAY_RGB.rainy;
            }
            if (c.indexOf('fog') >= 0 || c.indexOf('haze') >= 0 || c.indexOf('mist') >= 0) {
                return SKY_DAY_RGB.fog;
            }
            if (c.indexOf('partly') >= 0) return SKY_DAY_RGB.partlycloudy;
            if (c.indexOf('wind') >= 0) return SKY_DAY_RGB.windy;
            if (c.indexOf('exceptional') >= 0) return SKY_DAY_RGB.exceptional;
            if (c.indexOf('cloud') >= 0) return SKY_DAY_RGB.cloudy;
            if (c.indexOf('sunny') >= 0 || c === 'clear' || c.indexOf('sun') >= 0) {
                return SKY_DAY_RGB.sunny;
            }
            return SKY_DAY_RGB.cloudy;
        }

        function isDailyForecastHours(hours) {
            if (!hours || !hours.length) return false;
            for (var i = 0; i < hours.length; i++) {
                var e = hours[i];
                if (e && (e.daily === true || e.daily === 1 || e.mode === 'daily')) return true;
            }
            // Heuristic: weekday / Today labels and no clock hours → daily strip.
            var withHour = 0;
            for (var j = 0; j < hours.length; j++) {
                if (hourFromEntry(hours[j]) != null) withHour++;
            }
            return withHour === 0 && hours.length <= 7;
        }

        function rgbCssFromTriplet(rgb) {
            return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        }

        function dayPaletteStyle(condition) {
            var rgb = conditionDayRgb(condition);
            var lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
            return {
                background: rgbCssFromTriplet(rgb),
                dark: lum < 148
            };
        }

        function lerpRgb(a, b, t) {
            var u = Math.max(0, Math.min(1, t));
            return [
                Math.round(a[0] + (b[0] - a[0]) * u),
                Math.round(a[1] + (b[1] - a[1]) * u),
                Math.round(a[2] + (b[2] - a[2]) * u)
            ];
        }

        function parseHourLabel(label) {
            var s = String(label || '').trim();
            var m24 = s.match(/^(\d{1,2})(?::(\d{2}))?$/);
            if (m24 && s.indexOf('M') < 0 && s.indexOf('m') < 0) {
                var h24 = parseInt(m24[1], 10);
                if (h24 >= 0 && h24 <= 23) return h24;
            }
            var m12 = s.match(/^(\d{1,2})(?::\d{2})?\s*(AM|PM|am|pm|a\.m\.|p\.m\.)/);
            if (m12) {
                var h = parseInt(m12[1], 10) % 12;
                var ap = m12[2].charAt(0).toUpperCase();
                if (ap === 'P') h += 12;
                return h;
            }
            return null;
        }

        function hourFromEntry(entry) {
            if (!entry) return null;
            if (typeof entry.hour === 'number' && isFinite(entry.hour)) return entry.hour;
            if (entry.hour != null && entry.hour !== '') {
                var n = Number(entry.hour);
                if (isFinite(n)) return n;
            }
            return parseHourLabel(entry.t);
        }

        function monthFromEntry(entry) {
            if (entry && typeof entry.month === 'number' && entry.month >= 1 && entry.month <= 12) {
                return entry.month;
            }
            if (entry && entry.month != null) {
                var m = Number(entry.month);
                if (m >= 1 && m <= 12) return m;
            }
            return new Date().getMonth() + 1;
        }

        /**
         * Continuous solid sky color for one hour cell.
         * Summer: from ~19:00 keep deepening to midnight, then lift back to day blue.
         * Floor tint keeps rainy/cloudy nights slightly distinct ("多种夜晚").
         */
        function skyStyleForHour(hour, condition, month) {
            var bright = skyBrightness(hour, month);
            var mix = 0.1 + 0.9 * bright;
            var rgb = lerpRgb(SKY_DEEP_NIGHT, conditionDayRgb(condition), mix);
            var lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
            return {
                background: 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')',
                dark: lum < 148
            };
        }

        function skyRgbCss(entry, condition, daily) {
            var cond = condition || (entry && entry.condition) || 'cloudy';
            // Daily forecast: solid day blue / cloudy gray — never night darkening.
            if (daily || (entry && (entry.daily === true || entry.daily === 1))) {
                return dayPaletteStyle(cond).background;
            }
            var hour = hourFromEntry(entry);
            if (hour == null || !isFinite(hour)) {
                return dayPaletteStyle(cond).background;
            }
            return skyStyleForHour(hour, cond, monthFromEntry(entry)).background;
        }

        /** One continuous ramp on the bar — no hard vertical cuts between hours. */
        function applyBarSkyRamp(bar, hours, daily) {
            if (!bar || !hours || !hours.length) return;
            // Daily forecast: solid per-day chips — never a continuous bar gradient.
            if (daily) {
                bar.style.backgroundImage = '';
                bar.classList.remove('has-sky-ramp');
                return;
            }
            var parts = [];
            var n = hours.length;
            for (var i = 0; i < n; i++) {
                var entry = hours[i] || {};
                var color = skyRgbCss(entry, entry.condition, false);
                var pct = n === 1 ? 0 : (i / (n - 1)) * 100;
                parts.push(color + ' ' + pct.toFixed(2) + '%');
            }
            bar.style.backgroundImage = 'linear-gradient(to right, ' + parts.join(', ') + ')';
            bar.classList.add('has-sky-ramp');
        }

        function applySegSky(el, entry, condition, daily) {
            var style;
            if (daily || (entry && (entry.daily === true || entry.daily === 1))) {
                style = dayPaletteStyle(condition);
                // Solid day chip (sunny blue / cloudy gray) — no transparent + bar ramp.
                el.style.background = style.background;
            } else {
                var hour = hourFromEntry(entry);
                if (hour == null || !isFinite(hour)) {
                    style = dayPaletteStyle(condition);
                    el.style.background = style.background;
                } else {
                    style = skyStyleForHour(hour, condition, monthFromEntry(entry));
                    el.style.background = 'transparent';
                }
            }
            el.classList.add(style.dark ? 'sky-dark' : 'sky-light');
            el.classList.remove(style.dark ? 'sky-light' : 'sky-dark');
        }

        /**
         * Dynamic hourly axis (not fixed "always previous hour"):
         *   - Look back at most 3 hours so Now sits near the middle of ≤8 slots
         *   - Left → right chronological; window slides as the clock advances
         *   - Labels: "Now" / 12h AM·PM / 24h (isoTime)
         * Summer/winter colors follow each slot's hour + month.
         */
        var HOURLY_LOOKBACK_MAX = 3;

        function epochHourKey(ms) {
            return Math.floor((ms != null ? ms : Date.now()) / 3600000);
        }

        function epochHourKeyForClockHour(hourOfDay, nowMs) {
            var now = new Date(nowMs != null ? nowMs : Date.now());
            var nowH = now.getHours();
            var nowEpoch = epochHourKey(now.getTime());
            var h = ((Number(hourOfDay) % 24) + 24) % 24;
            var deltaPast = (nowH - h + 24) % 24;
            if (deltaPast <= 12) return nowEpoch - deltaPast;
            return nowEpoch + ((h - nowH + 24) % 24);
        }

        function pruneHourlyPastCache() {
            var nowEpoch = epochHourKey(Date.now());
            var minKey = nowEpoch - HOURLY_PAST_CACHE_MAX_AGE;
            var maxKey = nowEpoch + 16;
            Object.keys(hourlyPastCache).forEach(function (k) {
                var n = Number(k);
                if (n < minKey || n > maxKey) delete hourlyPastCache[k];
            });
        }

        /** Remember every hour we see (esp. Now) so it survives after upstream drops it. */
        function ingestHourlyPastCache(hours) {
            if (!hours || !hours.length) return;
            var nowMs = Date.now();
            for (var i = 0; i < hours.length; i++) {
                var entry = hours[i];
                if (!entry || entry.daily === true || entry.daily === 1) continue;
                var h = hourFromEntry(entry);
                if (h == null || !isFinite(h)) continue;
                h = ((h % 24) + 24) % 24;
                var key = epochHourKeyForClockHour(h, nowMs);
                var copy = {};
                for (var k in entry) {
                    if (Object.prototype.hasOwnProperty.call(entry, k)) copy[k] = entry[k];
                }
                copy.hour = h;
                hourlyPastCache[key] = copy;
            }
            pruneHourlyPastCache();
        }

        /**
         * Merge ≤3h local past with upstream Now+future.
         * Fresh upstream wins on conflict.
         */
        function mergeHourlyWithPastCache(upstream) {
            var list = Array.isArray(upstream) ? upstream : [];
            ingestHourlyPastCache(list);
            var nowMs = Date.now();
            var nowEpoch = epochHourKey(nowMs);
            var byEpoch = {};
            var d;
            for (d = HOURLY_LOOKBACK_MAX; d >= 1; d--) {
                var pk = nowEpoch - d;
                if (hourlyPastCache[pk]) byEpoch[pk] = hourlyPastCache[pk];
            }
            for (var i = 0; i < list.length; i++) {
                var entry = list[i];
                if (!entry || entry.daily === true || entry.daily === 1) continue;
                var h = hourFromEntry(entry);
                if (h == null || !isFinite(h)) continue;
                h = ((h % 24) + 24) % 24;
                byEpoch[epochHourKeyForClockHour(h, nowMs)] = entry;
            }
            for (d = 0; d <= 15; d++) {
                var fk = nowEpoch + d;
                if (!byEpoch[fk] && hourlyPastCache[fk]) byEpoch[fk] = hourlyPastCache[fk];
            }
            return Object.keys(byEpoch).map(Number).sort(function (a, b) { return a - b; })
                .map(function (key) { return byEpoch[key]; });
        }

        function clearHourlyPastCache() {
            hourlyPastCache = {};
        }

        function hourAxisLabel(hour24) {
            var h = ((Number(hour24) % 24) + 24) % 24;
            var nowH = new Date().getHours();
            if (h === nowH) return 'Now';
            if (isoTimeEnabled) {
                return (h < 10 ? '0' : '') + String(h);
            }
            var ap = h >= 12 ? 'PM' : 'AM';
            var h12 = h % 12;
            if (h12 === 0) h12 = 12;
            return h12 + ' ' + ap;
        }

        function stampTimelineEntry(entry, hour24) {
            var e = {};
            if (entry) {
                for (var k in entry) {
                    if (Object.prototype.hasOwnProperty.call(entry, k)) e[k] = entry[k];
                }
            }
            e.hour = ((Number(hour24) % 24) + 24) % 24;
            if (e.month == null) e.month = new Date().getMonth() + 1;
            e.t = hourAxisLabel(e.hour);
            return e;
        }

        /** Cap display at 8 hours. */
        function hourlyDisplayLimit() {
            const w = window.innerWidth || 0;
            if (w < 400) return 6;
            return 8;
        }

        /** Start hour for the rolling band: now − lookback (≤3), so Now is mid-strip. */
        function hourlyAxisStartHour(nowH, maxSlots) {
            var lookback = Math.min(HOURLY_LOOKBACK_MAX, Math.max(0, maxSlots - 1));
            return (nowH - lookback + 24) % 24;
        }

        /**
         * Build the live rolling window on a civil-time axis.
         * Up to 3 hours before Now (transition context), Now near center, then future.
         */
        function selectHourlyWindow(allHours, limit) {
            var max = Math.min(limit || 8, 8);
            if (!allHours || !allHours.length) return [];

            var nowH = new Date().getHours();
            var startH = hourlyAxisStartHour(nowH, max);

            var byHour = {};
            var sequential = [];
            for (var i = 0; i < allHours.length; i++) {
                var entry = allHours[i];
                var h = hourFromEntry(entry);
                if (h == null || !isFinite(h)) continue;
                h = ((h % 24) + 24) % 24;
                sequential.push({ hour: h, entry: entry, index: i });
                if (byHour[h] == null) byHour[h] = entry;
            }

            // No hour metadata — keep list order (daily-ish / legacy).
            if (!sequential.length) {
                return allHours.slice(0, max);
            }

            // Ideal dense axis from startH for max slots (Now at lookback index).
            var ideal = [];
            for (var s = 0; s < max; s++) {
                var want = (startH + s) % 24;
                if (byHour[want] != null) {
                    ideal.push(stampTimelineEntry(byHour[want], want));
                }
            }
            if (ideal.length >= Math.min(max, 6) || ideal.length === Object.keys(byHour).length) {
                return ideal.slice(0, max);
            }

            // Sparse forecast: consecutive slice from startH (else Now) in list order.
            var startIdx = 0;
            var foundStart = false;
            var foundNow = false;
            for (var j = 0; j < sequential.length; j++) {
                if (!foundStart && sequential[j].hour === startH) {
                    startIdx = j;
                    foundStart = true;
                    break;
                }
                if (!foundNow && sequential[j].hour === nowH) {
                    startIdx = j;
                    foundNow = true;
                }
            }
            if (!foundStart && !foundNow) startIdx = 0;
            if (startIdx > sequential.length - max) {
                startIdx = Math.max(0, sequential.length - max);
            }
            var out = [];
            for (var k = startIdx; k < sequential.length && out.length < max; k++) {
                out.push(stampTimelineEntry(sequential[k].entry, sequential[k].hour));
            }
            return out;
        }

        /**
         * Collapse consecutive identical weather icons when a run is longer than 2
         * (3+ same → one icon on the center hour). Color cells stay one-per-hour
         * so the dusk→night→dawn ramp stays continuous.
         */
        function buildHourlyIconRuns(hours, daily) {
            var runs = [];
            for (var i = 0; i < hours.length; ) {
                var cond = String(hours[i].condition || 'cloudy').replace(/\s+/g, '-');
                var iconHtml = hours[i].iconHtml || weatherIconFor(cond, { daily: daily });
                var j = i + 1;
                while (j < hours.length) {
                    var next = String(hours[j].condition || 'cloudy').replace(/\s+/g, '-');
                    if (next !== cond) break;
                    j++;
                }
                var len = j - i;
                runs.push({ condition: cond, iconHtml: iconHtml, start: i, length: len });
                i = j;
            }
            return runs;
        }

        function renderHourly() {
            const wrap = document.getElementById('hourly-wrap');
            // Weather entity + real rows only — never a demo bar
            if (!wrap || !slotsEnabled || !weatherEntityId || !hourlyHours.length) {
                hideHourly();
                return;
            }
            const daily = isDailyForecastHours(hourlyHours);
            const source = daily ? hourlyHours : mergeHourlyWithPastCache(hourlyHours);
            const hours = daily
                ? source.slice(0, 7)
                : selectHourlyWindow(source, hourlyDisplayLimit());
            wrap.innerHTML =
                '<div class="hourly frost">' +
                '<div class="hourly-bar" id="hourly-bar"></div>' +
                '<div class="hourly-labels" id="hourly-labels"></div>' +
                '</div>';
            const bar = document.getElementById('hourly-bar');
            const labels = document.getElementById('hourly-labels');
            if (!bar || !labels) return;

            applyBarSkyRamp(bar, hours, daily);

            var runs = buildHourlyIconRuns(hours, daily);
            runs.forEach(function (run) {
                var showIconAt = -1;
                if (mergeWeatherIconsEnabled && run.length > 2) {
                    showIconAt = run.start + Math.floor((run.length - 1) / 2);
                }
                for (var k = 0; k < run.length; k++) {
                    var idx = run.start + k;
                    var entry = hours[idx] || {};
                    var cell = document.createElement('div');
                    cell.className = 'seg c-' + run.condition;
                    if (showIconAt < 0 || idx === showIconAt) {
                        cell.innerHTML = run.iconHtml;
                    } else {
                        cell.innerHTML = '';
                    }
                    applySegSky(cell, entry, run.condition, daily);
                    bar.appendChild(cell);
                }
            });

            hours.forEach(function (h) {
                const col = document.createElement('div');
                col.className = 'hour-col';
                col.innerHTML =
                    '<div class="t">' + escapeHtml(h.t || '') + '</div>' +
                    '<div class="temp">' + escapeHtml(h.temp != null ? String(h.temp) : '') + '</div>';
                labels.appendChild(col);
            });
            wrap.classList.add('has-data');
            wrap.setAttribute('aria-hidden', 'false');
            syncLayoutClasses();
            scheduleWeatherFit();
        }

        function scrubClassicChrome() {
            document.body.classList.remove('classic-mode');
            var classic = document.getElementById('classic-ui');
            var badge = document.getElementById('logo-badge');
            var loader = document.getElementById('loader');
            if (classic) {
                classic.setAttribute('aria-hidden', 'true');
                classic.style.display = 'none';
            }
            if (badge) {
                badge.setAttribute('aria-hidden', 'true');
                badge.style.display = 'none';
            }
            if (loader) {
                loader.classList.remove('active');
                loader.style.display = 'none';
            }
        }

        function restoreClassicChrome() {
            document.body.classList.add('classic-mode');
            document.body.classList.remove('slots-mode', 'no-splash');
            var classic = document.getElementById('classic-ui');
            var badge = document.getElementById('logo-badge');
            var loader = document.getElementById('loader');
            if (classic) {
                classic.removeAttribute('aria-hidden');
                classic.style.removeProperty('display');
            }
            if (badge) {
                badge.removeAttribute('aria-hidden');
                badge.style.removeProperty('display');
            }
            if (loader) {
                loader.style.removeProperty('display');
            }
        }

        function playSplashOnce() {
            if (splashPlayed || !slotsEnabled) return;
            splashPlayed = true;
            splashRunning = true;
            scrubClassicChrome();
            const splash = document.getElementById('logo-splash');
            const ui = document.getElementById('slots-ui');
            document.body.classList.remove('no-splash');
            splash.classList.remove('run');
            ui.classList.remove('reveal');
            ui.style.removeProperty('opacity');
            void splash.offsetWidth;
            void ui.offsetWidth;
            splash.classList.add('run');
            ui.classList.add('reveal');
            const finishSplash = () => {
                if (!splashRunning && !splash.classList.contains('run')) return;
                splashRunning = false;
                splash.classList.remove('run');
                // Pull logo fully out of the layer stack after fake preload.
                document.body.classList.add('no-splash');
                scrubClassicChrome();
            };
            const onEnd = (ev) => {
                if (ev && ev.target !== splash) return;
                splash.removeEventListener('animationend', onEnd);
                finishSplash();
            };
            splash.addEventListener('animationend', onEnd);
            // Fallback if animationend is dropped by WebView pause.
            setTimeout(finishSplash, 2800);
        }

        function setSlotsMode(enabled) {
            const wasEnabled = slotsEnabled;
            slotsEnabled = !!enabled;
            toggleClass(document.body, 'slots-mode', slotsEnabled);
            if (slotsEnabled) {
                scrubClassicChrome();
                // Entering slots mode once → fake preload splash. Later setConfig
                // (entity ID edits / HA pushes) must NOT touch clock opacity or splash.
                if (!wasEnabled) {
                    splashPlayed = false;
                    playSplashOnce();
                    prefetchQuote();
                    fetchQuote();
                }
            } else {
                splashRunning = false;
                document.body.classList.remove(
                    'bright-wallpaper', 'no-splash',
                    'layout-corner', 'layout-center', 'layout-dashboard',
                    'has-capsules', 'has-weather', 'has-hourly'
                );
                const splash = document.getElementById('logo-splash');
                splash.classList.remove('run');
                document.getElementById('slots-ui').classList.remove('reveal');
                document.getElementById('slots-ui').style.removeProperty('opacity');
                hideHourly();
                restoreClassicChrome();
                fetchPoetry();
            }
            syncLayoutClasses();
            updateTime();
        }

        window.AvaDawn = {
            setConfig: function (cfg) {
                try {
                    cfg = cfg || {};
                    const enable = !!cfg.enabled;
                    // Mode / splash only when the enabled bit flips — entity edits stay data-only.
                    if (enable !== slotsEnabled) {
                        setSlotsMode(enable);
                    } else if (enable) {
                        document.body.classList.add('slots-mode');
                        scrubClassicChrome();
                    } else {
                        document.body.classList.remove('slots-mode');
                        restoreClassicChrome();
                    }
                    var prevWeatherId = weatherEntityId;
                    weatherEntityId = String(cfg.weatherEntityId || '').trim();
                    slotData = normalizeSlots(cfg.slots);
                    // Flags before paint so hourly / clock use the latest values.
                    isoTimeEnabled = !!cfg.isoTime;
                    toggleClass(document.body, 'iso-time', isoTimeEnabled);
                    mergeWeatherIconsEnabled = !!cfg.mergeWeatherIcons;
                    renderSlots();
                    // Capsules: only filled entity IDs. Hourly: weather entity + real hours.
                    // Important: empty/missing cfg.hourly must NOT wipe a strip that setHourly
                    // already painted — Kotlin often re-injects setConfig while forecast is in flight.
                    if (!weatherEntityId) {
                        hourlyHours = [];
                        clearHourlyPastCache();
                        hideHourly();
                    } else if (Array.isArray(cfg.hourly) && cfg.hourly.length) {
                        hourlyHours = cfg.hourly;
                        ingestHourlyPastCache(hourlyHours);
                        renderHourly();
                    } else if (prevWeatherId && prevWeatherId !== weatherEntityId) {
                        // Weather entity changed — drop stale hours for the old ID.
                        hourlyHours = [];
                        clearHourlyPastCache();
                        hideHourly();
                    } else if (hourlyHours.length) {
                        renderHourly();
                    } else {
                        syncLayoutClasses();
                    }
                    // Keep clock digits alive across entity-id reconfigs.
                    if (slotsEnabled) updateTime();
                    // Wallpaper source: empty / whitespace → built-in default.
                    var nextSrc = String(cfg.wallpaperSource || '').trim();
                    if (nextSrc !== wallpaperSourceUrl) {
                        wallpaperSourceUrl = nextSrc;
                        try {
                            localStorage.removeItem(CACHE_KEY_WALLPAPER);
                            localStorage.removeItem('xiaomi_wallpaper_cache');
                        } catch (e2) {}
                        fetchWallpaper(true);
                    }
                } catch (e) {}
            },
            updateEntity: function (patch) {
                try {
                    // Only refresh slots the user actually configured — never invent capsules
                    if (!patch || !String(patch.entityId || '').trim()) return;
                    const entityId = String(patch.entityId).trim();
                    const idx = slotData.findIndex(function (s) { return s.entityId === entityId; });
                    if (idx < 0) {
                        // Entity id was rewritten in settings — full slot list comes via setConfig.
                        return;
                    }
                    slotData[idx] = Object.assign({}, slotData[idx], patch, { entityId: entityId });
                    renderSlots();
                } catch (e) {}
            },
            setHourly: function (payload) {
                try {
                    payload = payload || {};
                    const entityId = String(payload.weatherEntityId || weatherEntityId || '').trim();
                    const hours = Array.isArray(payload.hours) ? payload.hours : [];
                    weatherEntityId = entityId;
                    if (!entityId || !hours.length) {
                        hideHourly();
                        return;
                    }
                    hourlyHours = hours;
                    ingestHourlyPastCache(hours);
                    renderHourly();
                } catch (e) {}
            },
            /** Seed ≤3h past cache (HA upstream is Now+future only). */
            ingestHourlyPastCache: ingestHourlyPastCache,
            clearHourlyPastCache: clearHourlyPastCache
        };

        function init() {
            try {
                scrubClassicChrome();
                updateTime();
                stepAmbient();
                fetchWallpaper(true);
                // Classic poem only if App never enables slots (standalone / classic wallpaper).
                setTimeout(function () {
                    if (!slotsEnabled) {
                        restoreClassicChrome();
                        fetchPoetry();
                    }
                }, 900);
                setInterval(updateTime, 1000);
                setInterval(stepAmbient, AMBIENT_STEP_MS);
                setInterval(function () { fetchWallpaper(false); }, 60000 * 5);
                setInterval(fetchPoetry, 60000 * 5);
                setInterval(function () { if (slotsEnabled) fetchQuote(); }, 60000 * 5);
                var resizeTimer = 0;
                window.addEventListener('resize', function () {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        if (slotsEnabled) fitSlotsClock();
                        if (slotsEnabled && weatherEntityId && hourlyHours.length) renderHourly();
                        else scheduleWeatherFit();
                    }, 120);
                });
            } catch (e) {
                try { updateTime(); } catch (e2) {}
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
