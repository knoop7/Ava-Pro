<!DOCTYPE html>
<html lang="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dawn · Magazine Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Noto+Serif+SC:wght@300;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --glass: rgba(22, 26, 34, 0.38);
            --glass-edge: rgba(255, 255, 255, 0.14);
            --glass-edge-inner: rgba(255, 255, 255, 0.06);
            --glass-blur: 18px;
            /*
             * Phone + tablet first: px floors + vmin. Pure vw made date/quote ~5–7px
             * on 360–430 phones. Compact scale only for tiny panels (not phone landscape).
             * Declare plain fallbacks before clamp/min — old WebViews drop unsupported values.
             */
            --slots-gap: 16px;
            --slots-gap: clamp(14px, 2.4vmin, 22px);
            --slot-name: 15px;
            --slot-name: clamp(13px, 2.8vmin, 18px);
            --slot-state: 22px;
            --slot-state: clamp(19px, 4.2vmin, 28px);
            --slot-ico: 28px;
            --slot-ico: clamp(24px, 4.6vmin, 32px);
            --slot-gap-inner: 14px;
            --slot-gap-inner: clamp(12px, 2.2vmin, 18px);
            --slot-pad-y: 14px;
            --slot-pad-y: clamp(12px, 2vmin, 18px);
            --slot-pad-x: 22px;
            --slot-pad-x: clamp(18px, 2.8vmin, 28px);
            --slot-min-h: 64px;
            --slot-min-h: clamp(56px, 9vmin, 76px);
            --right-col-w: 280px;
            --right-col-w: clamp(240px, 34vmin, 340px);
            --date-size: 18px;
            --date-size: clamp(15px, 3.2vmin, 22px);
            --quote-size: 15px;
            --quote-size: clamp(14px, 2.8vmin, 20px);
            --quote-author: 12px;
            --quote-author: clamp(11px, 2vmin, 14px);
            --clock-size: 120px;
            --clock-size: clamp(72px, 18vmin, 168px);
            --clock-colon: 88px;
            --clock-colon: clamp(52px, 13vmin, 120px);
            --ampm-size: 20px;
            --ampm-size: clamp(16px, 3.6vmin, 28px);
            --hourly-w: 90vw;
            --hourly-w: min(90vw, 720px);
            --hourly-pad: 16px;
            --hourly-pad: clamp(14px, 2.2vmin, 20px);
            --hourly-bar-h: 44px;
            --hourly-bar-h: clamp(36px, 6vmin, 52px);
            --hourly-ico: 22px;
            --hourly-ico: clamp(18px, 3.4vmin, 26px);
            --hourly-label: 15px;
            --hourly-label: clamp(13px, 2.6vmin, 18px);
            --hourly-temp: 16px;
            --hourly-temp: clamp(14px, 2.8vmin, 20px);
            --hourly-radius: 20px;
            --hourly-radius: clamp(16px, 2.6vmin, 24px);
            --hourly-labels-gap: 10px;
            --hourly-labels-gap: clamp(8px, 1.4vmin, 12px);
        }

        /* Tiny panels only — do NOT use phone landscape height alone */
        @media (max-width: 360px) {
            :root {
                --slots-gap: 10px;
                --slot-name: 11px;
                --slot-state: 15px;
                --slot-ico: 18px;
                --slot-gap-inner: 8px;
                --slot-pad-y: 9px;
                --slot-pad-x: 12px;
                --slot-min-h: 46px;
                --right-col-w: 42vw;
                --right-col-w: min(168px, 42vw);
                --date-size: 13px;
                --quote-size: 12px;
                --quote-author: 10px;
                --clock-size: 72px;
                --clock-size: clamp(56px, 16vw, 96px);
                --clock-colon: 52px;
                --clock-colon: clamp(40px, 12vw, 72px);
                --ampm-size: 14px;
                --hourly-w: 94vw;
                --hourly-w: min(94vw, 360px);
                --hourly-pad: 10px;
                --hourly-bar-h: 28px;
                --hourly-ico: 14px;
                --hourly-label: 11px;
                --hourly-temp: 12px;
                --hourly-radius: 14px;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1a1a1a;
            color: var(--text-primary);
        }

        /* Opacity-only crossfade — avoids size/blur jitter */
        /* Note: avoid CSS inset shorthand — ignored on older Android WebViews (<87),
           which shrinks absolute layers to content and parks UI top-left. */
        .wallpaper-container {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .wallpaper-layer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.6s ease-in-out;
            will-change: opacity;
            z-index: 1;
        }

        .wallpaper-layer.active {
            opacity: 1;
            z-index: 1;
        }

        .wallpaper-layer.exiting {
            opacity: 0;
            z-index: 2;
        }

        .wallpaper-layer .parallax {
            position: absolute;
            top: -6%;
            left: -6%;
            width: 112%;
            height: 112%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translate3d(0, 0, 0);
        }

        /* The pan is stepped from JS once a second rather than run as a CSS
           animation. A full 60s sweep travels ~12px, so per-vsync interpolation is
           invisible, but it would keep the compositor producing frames forever. */

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.7) 0%,
                rgba(0,0,0,0.3) 50%,
                transparent 100%
            );
            z-index: 2;
            pointer-events: none;
        }

        .mist {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, transparent 40%),
                linear-gradient(90deg, rgba(0,0,0,0.16), transparent 28%, transparent 72%, rgba(0,0,0,0.18));
        }

        .readability-veil {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
            opacity: 0.35;
            background:
                radial-gradient(ellipse 70% 55% at 18% 18%, rgba(0, 0, 0, 0.28), transparent 62%),
                radial-gradient(ellipse 55% 60% at 88% 22%, rgba(0, 0, 0, 0.26), transparent 60%),
                radial-gradient(ellipse 70% 45% at 50% 92%, rgba(0, 0, 0, 0.3), transparent 65%);
            transition: opacity 0.6s ease;
        }

        body.slots-mode .mist,
        body.slots-mode .readability-veil {
            display: block;
        }

        body.bright-wallpaper .readability-veil {
            opacity: 0.55;
        }

        /* —— Classic bottom-left poem layout —— */
        .info-container {
            position: absolute;
            bottom: 8vh;
            left: 5vw;
            z-index: 3;
            color: var(--text-primary);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 85%;
            /* Hidden until classic-mode — avoids flash under slots splash / setConfig race */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-badge {
            position: absolute;
            top: 32px;
            right: 32px;
            width: 48px;
            height: 48px;
            object-fit: contain;
            opacity: 0;
            visibility: hidden;
            z-index: 3;
            pointer-events: none;
        }

        /* Classic poem wallpaper only (slots disabled) */
        body.classic-mode .info-container {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        body.classic-mode .logo-badge {
            opacity: 0.25;
            visibility: visible;
        }

        /* Slots / splash: scrub classic chrome completely (no bottom-left / top-right residue) */
        body.slots-mode .info-container,
        body.slots-mode .logo-badge,
        body.slots-mode #classic-ui,
        body.slots-mode #logo-badge {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .time-display {
            display: flex;
            align-items: baseline;
            line-height: 0.8;
            margin-left: -6px;
            position: relative;
            font-feature-settings: "tnum" 1;
        }

        .hour {
            font-size: 10vw;
            font-weight: 800;
            letter-spacing: -0.3vw;
            position: relative;
            z-index: 2;
        }

        .colon {
            font-size: 7.5vw;
            font-weight: 600;
            margin: 0 0.5vw;
            opacity: 0.8;
            position: relative;
            top: -1.6vw;
            z-index: 2;
        }

        .minute {
            font-size: 10vw;
            font-weight: 800;
            letter-spacing: -0.3vw;
            opacity: 0.65;
            position: relative;
            z-index: 2;
        }

        .ampm {
            display: none;
            font-size: 2.4vw;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-left: 0.8vw;
            opacity: 0.85;
            position: relative;
            top: -0.35em;
            z-index: 2;
        }

        body.slots-mode .ampm {
            display: inline;
        }

        body.slots-mode.iso-time .ampm {
            display: none;
        }

        .date-display {
            margin-top: 1vh;
            margin-left: 0.5vw;
            font-size: 1.8vw;
            font-weight: 300;
            letter-spacing: 0.15vw;
            display: flex;
            align-items: center;
            opacity: 0.85;
            position: relative;
            z-index: 2;
        }

        .date-divider {
            width: 0.4vw;
            height: 0.4vw;
            background: #fff;
            border-radius: 50%;
            margin: 0 1.2vw;
            opacity: 0.8;
        }

        .poem-wrapper {
            margin-top: 1.5vh;
            margin-left: 0.5vw;
            padding-left: 2vw;
            border-left: 0.3vw solid rgba(255,255,255,0.8);
            animation: fadeIn 1s ease-out 0.5s forwards;
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }

        .poem-content {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.6vw;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 1vh;
            opacity: 1;
        }

        .poem-meta {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1vw;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.1vw;
        }

        /* —— Slots morphologies ——
           - layout-corner: no weather ID & no capsules → bottom-left
           - layout-center: weather-only OR capsules-only → center clock, dock bottom
           - layout-dashboard: weather ID + capsules → top-left clock, right capsules, weather BOTTOM only
        */
        .slots-screen {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 5.5vh 4vw 4.2vh;
            display: none;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            z-index: 3;
            opacity: 0;
            box-sizing: border-box;
        }

        body.slots-mode .slots-screen {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
        }

        body.slots-mode .slots-screen.reveal {
            animation: uiReveal 1s ease 2.1s forwards;
        }

        body.slots-mode.no-splash .slots-screen {
            opacity: 1;
            animation: none;
        }

        @keyframes uiReveal {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .top-row {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: start;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            width: 100%;
            min-height: 0;
            -webkit-box-flex: 1;
            -webkit-flex: 1 1 auto;
            flex: 1;
        }

        /* gap is Chromium 84+ — margins always; html.flex-gap (JS probe) upgrades to gap */
        .top-row > .right-col {
            margin-left: 3vw;
        }

        .slots-left {
            z-index: 2;
            max-width: 62%;
            max-width: calc(100% - var(--right-col-w) - 16px);
            min-width: 0;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.35),
                0 2px 10px rgba(0, 0, 0, 0.28),
                0 6px 22px rgba(0, 0, 0, 0.18);
        }

        body.bright-wallpaper .slots-left {
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.35),
                0 2px 10px rgba(0, 0, 0, 0.28),
                0 6px 22px rgba(0, 0, 0, 0.18);
        }

        .slots-date {
            margin-top: 14px;
            margin-top: clamp(10px, 1.8vh, 18px);
            margin-left: 0;
            font-size: var(--date-size);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            opacity: 0.9;
            white-space: nowrap;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.35),
                0 3px 12px rgba(0, 0, 0, 0.25);
        }

        .quote {
            margin-top: 12px;
            margin-top: clamp(10px, 1.6vh, 16px);
            margin-left: 0;
            /* Hard px cap first — old WebViews ignore min() and 52vw blows up on TVs */
            max-width: 420px;
            max-width: min(48vw, 420px);
            width: 100%;
            box-sizing: border-box;
            padding-left: 12px;
            padding-left: clamp(10px, 1.4vw, 16px);
            border-left: 2px solid rgba(255, 255, 255, 0.55);
            opacity: 0;
            transition: opacity 0.8s ease;
            position: relative;
            z-index: 2;
        }

        .quote.show { opacity: 1; }

        .quote .quote-text {
            font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
            font-size: var(--quote-size);
            font-weight: 400;
            line-height: 1.48;
            letter-spacing: 0.015em;
            color: rgba(255, 255, 255, 0.84);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.35),
                0 3px 12px rgba(0, 0, 0, 0.24);
        }

        .quote .quote-author {
            font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
            margin-top: 0.55em;
            font-size: var(--quote-author);
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.52);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.32);
        }

        /* Capsules — phone/tablet readable (clamp), not pure-vw crumbs */
        .slot {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            min-height: var(--slot-min-h);
            padding: var(--slot-pad-y) var(--slot-pad-x) var(--slot-pad-y) calc(var(--slot-pad-x) * 0.75);
            border-radius: 999px;
            background: rgba(22, 26, 34, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                inset 0 0.5px 0 rgba(255, 255, 255, 0.05),
                0 2px 14px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.1);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.1);
        }

        .slot > .ico {
            margin-right: 14px;
            margin-right: var(--slot-gap-inner);
        }

        body.bright-wallpaper .slot {
            background: rgba(16, 18, 24, 0.32);
        }

        .slot .ico {
            width: var(--slot-ico);
            height: var(--slot-ico);
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            opacity: 0.95;
            line-height: 1;
        }

        .slot .ico img,
        .slot .ico svg {
            width: calc(var(--slot-ico) * 0.9);
            height: calc(var(--slot-ico) * 0.9);
            object-fit: contain;
            display: block;
        }

        .slot .text {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            min-width: 0;
            -webkit-box-flex: 1;
            -webkit-flex: 1 1 auto;
            flex: 1;
        }

        .slot .name {
            margin-bottom: 2px;
            font-size: var(--slot-name);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        .slot .state {
            font-size: var(--slot-state);
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        /* Right column = capsules ONLY (never weather) */
        .right-col {
            display: none;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: stretch;
            -webkit-align-items: stretch;
            align-items: stretch;
            width: var(--right-col-w);
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            z-index: 2;
            margin-top: 0.15vw;
            -webkit-align-self: flex-start;
            align-self: flex-start;
        }

        body.slots-mode.has-capsules .right-col {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
        }

        .slots {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            width: 100%;
        }

        .slots > .slot + .slot {
            margin-top: 16px;
            margin-top: var(--slots-gap);
        }

        .slots:empty,
        .slots.hidden {
            display: none;
        }

        /* Weather ALWAYS bottom dock — never top-right */
        .bottom-dock {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 4.5%;
            z-index: 4;
            display: none;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            pointer-events: none;
        }

        .bottom-dock > * + * {
            margin-top: 16px;
            margin-top: var(--slots-gap);
        }

        .bottom-dock > * {
            pointer-events: auto;
        }

        body.slots-mode.has-weather .bottom-dock {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
        }

        .hourly-wrap {
            display: none;
            width: var(--hourly-w);
            z-index: 2;
        }

        body.slots-mode .hourly-wrap.has-data {
            display: block;
        }

        .hourly {
            border-radius: var(--hourly-radius);
            padding: var(--hourly-pad);
            background: rgba(22, 26, 34, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                inset 0 0.5px 0 rgba(255, 255, 255, 0.06),
                0 3px 14px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(18px) saturate(1.1);
            -webkit-backdrop-filter: blur(18px) saturate(1.1);
        }

        .hourly-bar {
            display: flex;
            height: var(--hourly-bar-h);
            border-radius: 999px;
            overflow: hidden;
        }

        /* Per-hour cells are transparent — continuous sky lives on the bar gradient. */
        .hourly-bar.has-sky-ramp .seg {
            background: transparent !important;
        }

        .seg {
            -webkit-flex: 1 1 0;
            flex: 1 1 0;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .seg svg {
            width: var(--hourly-ico);
            height: var(--hourly-ico);
            opacity: 0.95;
            /* color only — do not set fill here or fill="none" stroke rays get solid-filled */
            color: inherit;
            position: relative;
            z-index: 2;
        }

        /*
         * Fallback solid chips (daily / unknown hour). Hourly strip uses a
         * continuous bar gradient; daily strip stays solid per-day blocks.
         */
        .c-clear-night,
        .c-partlycloudy-night,
        .c-cloudy-night {
            background: #0a0e16;
            color: #ffffff;
        }
        .c-cloudy { background: #4a5566; color: #ffffff; }
        .c-fog,
        .c-foggy,

        /*

         * Must not sit "between" clock layers — UI stays opacity:0 until reveal finishes.
         * Entity setConfig must not interrupt this (see setSlotsMode).

        .logo-splash {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.04);
            opacity: 0;
            visibility: hidden;

        body.slots-mode .logo-splash {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;

            height: auto;
            object-fit: contain;
            opacity: 0;
            -webkit-transform: scale(0.94);
            transform: scale(0.94);

        .logo-splash.run {

        }

        .logo-splash.run img {

        }

        body.slots-mode.no-splash .logo-splash {
            display: none !important;
            animation: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        @keyframes splashVeil {
            0%   { opacity: 0; }
            14%  { opacity: 1; }
            58%  { opacity: 1; }
            100% { opacity: 0; }

        @keyframes splashMark {
            0%   { opacity: 0; transform: scale(0.94); }
            20%  { opacity: 0.2; transform: scale(1); }
            58%  { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.015); }

        .loader {

            bottom: 30px;
            right: 30px;

            height: 18px;

    <script>
        /*

         * - Avoid optional chaining / nullish coalesce (parse-time SyntaxError kills ALL script)
         * - Polyfill a few ES2015/2017 runtime helpers used below

         */
        (function () {
            // Modernizr-style flex gap probe — see bram.us / ishadeed.com
            try {
                var flex = document.createElement('div');
                flex.style.display = 'flex';
                flex.style.flexDirection = 'column';
                flex.style.rowGap = '1px';
                flex.appendChild(document.createElement('div'));
                flex.appendChild(document.createElement('div'));
                flex.style.position = 'absolute';
                flex.style.visibility = 'hidden';
                flex.style.pointerEvents = 'none';
                document.documentElement.appendChild(flex);
                var supported = flex.scrollHeight === 1;
                document.documentElement.removeChild(flex);
                if (supported) {
                    document.documentElement.className +=
                        (document.documentElement.className ? ' ' : '') + 'flex-gap';
                }
            } catch (e) {}

            if (!String.prototype.padStart) {
                String.prototype.padStart = function (targetLength, padString) {
                    var str = String(this);
                    var len = targetLength >> 0;
                    var pad = padString !== undefined ? String(padString) : ' ';
                    if (str.length >= len) return str;
                    len = len - str.length;
                    if (len > pad.length) {
                        pad += pad.repeat ? pad.repeat(len / pad.length) : new Array(len + 1).join(pad);
                    }
                    return pad.slice(0, len) + str;
                };
            }
            if (!String.prototype.startsWith) {
                String.prototype.startsWith = function (search, pos) {
                    pos = pos || 0;
                    return this.substring(pos, pos + search.length) === search;
                };
            }
            if (!String.prototype.includes) {
                String.prototype.includes = function (search, start) {
                    return this.indexOf(search, start || 0) !== -1;
                };
            }
            if (!Array.prototype.includes) {
                Array.prototype.includes = function (search) {
                    return this.indexOf(search) !== -1;
                };
            }
            if (!Array.prototype.findIndex) {
                Array.prototype.findIndex = function (predicate) {

        function withTimeoutSignal(ms) {
            // AbortController missing on some old WebViews — omit signal, still clear timer.
            if (typeof AbortController === 'undefined') {
                var t = setTimeout(function () {}, ms);
                return { signal: undefined, clear: function () { clearTimeout(t); } };
            }
            var controller = new AbortController();
            var timer = setTimeout(function () {
                try { controller.abort(); } catch (e) {}
            }, ms);
            return {
                signal: controller.signal,
                clear: function () { clearTimeout(timer); }
            };
        }

        function safeFetch(url, options, timeoutMs) {
            if (typeof fetch !== 'function') {
                return Promise.reject(new Error('fetch unavailable'));
            }
            options = options || {};
            var gate = withTimeoutSignal(timeoutMs || 10000);
            var opts = {};
            for (var k in options) {
                if (Object.prototype.hasOwnProperty.call(options, k)) opts[k] = options[k];
            }
            if (gate.signal) opts.signal = gate.signal;
            return fetch(url, opts).then(function (res) {
                gate.clear();
                return res;
            }, function (err) {
                gate.clear();
                throw err;
            });
        }

        // Older WebViews may lack classList.toggle(token, force).
        function toggleClass(el, name, on) {
            if (!el || !el.classList) return;
            if (arguments.length < 3) {
                el.classList.toggle(name);
                return;
            }
            if (on) el.classList.add(name);
            else el.classList.remove(name);
        }

        const DEFAULT_WALLPAPER_API = 'https://v2.xxapi.cn/api/wallpaper';
        const CACHE_KEY_WALLPAPER = 'dawn_wallpaper_cache';
        const CACHE_KEY_POETRY = 'dawn_poetry_cache';
        const CACHE_KEY_QUOTE = 'dawn_quote_cache';

        let currentBgIndex = 1;
        let wallpaperSwapId = 0;
        let wallpaperBusy = false;
        let pendingWallpaperUrl = null;
        let displayedWallpaperUrl = '';
        let wallpaperSafetyTimer = 0;
        /** Custom source from App; empty / whitespace → built-in default. */
        let wallpaperSourceUrl = '';
        let slotsEnabled = false;
        let slotData = [];
        let splashPlayed = false;
        let splashRunning = false;
        let weatherEntityId = '';
        let hourlyHours = [];
        let lastHourlyAxisHour = -1;
        /**
         * Upstream hourly is Now+future only. Cache recent hours locally so lookback
         * (≤3) stays filled after those hours drop out of the HA payload.
         * Key = epoch hour (Math.floor(ms / 3600000)).
         */
        var hourlyPastCache = {};
        var HOURLY_PAST_CACHE_MAX_AGE = 6;
        /** When true: slots clock is 00–23 (no AM/PM). Default false = 12h + AM/PM. */
        let isoTimeEnabled = false;
        /** When true: merge 3+ consecutive identical weather icons. Default off. */
        let mergeWeatherIconsEnabled = false;

        function resolveWallpaperSource() {
            var s = String(wallpaperSourceUrl || '').trim();
            return s || DEFAULT_WALLPAPER_API;
        }

        function looksLikeDirectImageUrl(url) {
            var u = String(url || '').trim();
            if (!u) return false;
            if (u.indexOf('data:image/') === 0) return true;
            return /\.(jpe?g|png|webp|gif|bmp|avif)(\?|#|$)/i.test(u);
        }

        function getCachedWallpaper() {
            try {
                return localStorage.getItem(CACHE_KEY_WALLPAPER)
                    || localStorage.getItem('xiaomi_wallpaper_cache');
            } catch (e) { return null; }
        }

        function setCachedWallpaper(url) {
            try {
                localStorage.setItem(CACHE_KEY_WALLPAPER, url);
                localStorage.removeItem('xiaomi_wallpaper_cache');
            } catch (e) {}
        }

        function getCachedPoetry() {
            try {
                const data = localStorage.getItem(CACHE_KEY_POETRY)
                    || localStorage.getItem('xiaomi_poetry_cache');
                return data ? JSON.parse(data) : null;
            } catch (e) { return null; }
        }

        function setCachedPoetry(content, author, dynasty) {
            try {
                localStorage.setItem(CACHE_KEY_POETRY, JSON.stringify({ content, author, dynasty }));
            } catch (e) {}
        }

        function isChinese() {
            const lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            var tz = '';
            try {
                if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
                    tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                }
            } catch (e) {}
            const chinaTimezones = ['asia/shanghai', 'asia/chongqing', 'asia/hong_kong', 'asia/taipei', 'asia/macau'];
            return lang.indexOf('zh') === 0 || chinaTimezones.indexOf(tz.toLowerCase()) !== -1;
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function wallpaperNeedsDarkening(img) {
            try {
                const size = 48;
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                var ctx = null;
                try { ctx = c.getContext('2d', { willReadFrequently: true }); } catch (e1) { ctx = c.getContext('2d'); }
                if (!ctx) return false;
                ctx.drawImage(img, 0, 0, size, size);
                var imageData = ctx.getImageData(0, 0, size, size);
                var data = imageData.data;
                var regionLuma = function (x0, y0, x1, y1) {
                    var sum = 0, n = 0;
                    for (var y = y0; y < y1; y++) {
                        for (var x = x0; x < x1; x++) {
                            var i = (y * size + x) * 4;
                            sum += 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
                            n++;
                        }
                    }
                    return n ? sum / n / 255 : 0;

                var zones = [
                    regionLuma(0, 0, 22, 18),
                    regionLuma(30, 0, 48, 22),
                    regionLuma(10, 32, 38, 48),
                ];
                return Math.max.apply(null, zones) >= 0.58;
            } catch (e) {
                return document.body.classList.contains('bright-wallpaper');
            }
        }

        function applyWallpaperContrast(img) {
            if (!slotsEnabled) {
                document.body.classList.remove('bright-wallpaper');
                return;
            }
            toggleClass(document.body, 'bright-wallpaper', wallpaperNeedsDarkening(img));
        }

        // Stands in for the `parallaxPan` and `blink` CSS animations, which kept the
        // compositor producing a frame every vsync for as long as the page was up.
        // Sampling both on one 4Hz timer holds the pan under 0.35px per step and the
        // colon pulse under 0.1 opacity per step, below what the eye resolves.
        const AMBIENT_STEP_MS = 250;
        const PARALLAX_PERIOD_MS = 60000;
        const COLON_PERIOD_MS = 2000;

        function stepAmbient() {
            const now = Date.now();

            // Same ellipse the parallaxPan keyframes traced.
            const phase = (now % PARALLAX_PERIOD_MS) / PARALLAX_PERIOD_MS * Math.PI * 2;
            const x = (-1.1 * Math.sin(phase)).toFixed(3);
            const y = (-0.55 * (1 - Math.cos(phase))).toFixed(3);
            const layers = document.querySelectorAll(
                '.wallpaper-layer.active .parallax, .wallpaper-layer.exiting .parallax');
            for (let i = 0; i < layers.length; i++) {
                layers[i].style.transform = `translate3d(${x}%, ${y}%, 0)`;
            }

            // Same 0.8 -> 0.3 -> 0.8 curve the blink keyframes described.
            const pulse = (now % COLON_PERIOD_MS) / COLON_PERIOD_MS * Math.PI * 2;
            const colonOpacity = (0.55 + 0.25 * Math.cos(pulse)).toFixed(3);
            const colons = document.querySelectorAll('.colon');
            for (let i = 0; i < colons.length; i++) {
                colons[i].style.opacity = colonOpacity;
            }
        }

        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const h24 = now.getHours();
            const minute = String(now.getMinutes()).padStart(2, '0');

            if (slotsEnabled) {
                var ampmEl = document.getElementById('slots-ampm');
                if (isoTimeEnabled) {
                    // ISO 24h: midnight 00:, no AM/PM
                    document.getElementById('slots-hour').textContent = String(h24).padStart(2, '0');
                    document.getElementById('slots-minute').textContent = minute;
                    if (ampmEl) {
                        ampmEl.textContent = '';
                        ampmEl.setAttribute('aria-hidden', 'true');
                    }
                } else {
                    // Standard 12h + AM/PM: midnight 12:xx AM, noon 12:xx PM
                    var h12 = h24 % 12 || 12;
                    var ampm = h24 < 12 ? 'AM' : 'PM';
                    document.getElementById('slots-hour').textContent = String(h12);
                    document.getElementById('slots-minute').textContent = minute;
                    if (ampmEl) {
                        ampmEl.textContent = ampm;
                        ampmEl.removeAttribute('aria-hidden');
                    }
                }
                const weekDays = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
                const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
                document.getElementById('slots-date').textContent =
                    `${weekDays[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${year}`;
                requestAnimationFrame(fitSlotsClock);
                // Slide the hourly strip when the civil hour rolls (lookback ≤3, Now near center).
                if (h24 !== lastHourlyAxisHour) {
                    lastHourlyAxisHour = h24;
                    if (weatherEntityId && hourlyHours.length) {
                        try { renderHourly(); } catch (e) {}
                    }
                }
            } else {
                const hour = String(h24).padStart(2, '0');
                document.getElementById('hour').textContent = hour;
                document.getElementById('minute').textContent = minute;
                if (isChinese()) {
                    const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    document.getElementById('weekday').textContent = weekDays[now.getDay()];
                    document.getElementById('date-full').textContent =
                        `${year}年${now.getMonth() + 1}月${now.getDate()}日`;
                } else {
                    const weekDays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    document.getElementById('weekday').textContent = weekDays[now.getDay()];
                    document.getElementById('date-full').textContent =
                        `${months[now.getMonth()]} ${now.getDate()}, ${year}`;
                }
            }
        }

        /**
         * Portrait / wide-digit safety: if HH:MM(+AM/PM) still overflows the padded
         * column, shrink the clock row (zoom prefers layout; transform is fallback).
         */
        function fitSlotsClock() {
            if (!slotsEnabled) return;
            var td = document.querySelector('#slots-ui .slots-left .time-display');
            if (!td) return;
            var col = td.parentElement;
            if (!col) return;

            td.style.zoom = '';
            td.style.transform = '';
            td.style.transformOrigin = '';

            var avail = col.clientWidth;
            if (avail >= 40) {
                var need = td.scrollWidth;
                if (need > avail + 1) {
                    var scale = Math.max(0.55, (avail - 2) / need);
                    var corner = document.body.classList.contains('layout-corner');
                    try {
                        td.style.zoom = String(scale);
                        // If zoom ignored, scrollWidth stays huge — fall back to transform.
                        if (td.scrollWidth > avail + 2) {
                            td.style.zoom = '';
                            td.style.transformOrigin = corner ? 'left center' : 'center center';
                            td.style.transform = 'scale(' + scale + ')';
                        }
                    } catch (e) {
                        td.style.transformOrigin = corner ? 'left center' : 'center center';
                        td.style.transform = 'scale(' + scale + ')';
                    }
                }
            }
            scheduleWeatherFit();
        }

        function clearWeatherFit() {
            var wrap = document.getElementById('hourly-wrap');
            if (!wrap) return;
            wrap.style.zoom = '';
            wrap.style.transform = '';
            wrap.style.transformOrigin = '';
            wrap.style.maxWidth = '';
            wrap.style.width = '';
        }

        /**
         * Landscape weather-only: if the hourly bar covers the quote author,
         * shrink HEIGHT carefully (bottom-anchored) and slightly LENGTHEN width
         * so the bar stays readable — never aggressive.
         */
        function fitWeatherVsQuoteAuthor() {
            if (!slotsEnabled) {
                clearWeatherFit();
                return;
            }
            var vw = window.innerWidth || 0;
            var vh = window.innerHeight || 0;
            var landscape = vw > vh;
            var body = document.body;
            var weatherOnly = body.classList.contains('layout-center')
                && body.classList.contains('has-weather')
                && !body.classList.contains('has-capsules');
            var wrap = document.getElementById('hourly-wrap');
            var author = document.getElementById('quote-author');
            if (!landscape || !weatherOnly || !wrap || !wrap.classList.contains('has-data') || !author) {
                clearWeatherFit();
                return;
            }
            if (!String(author.textContent || '').trim()) {
                clearWeatherFit();
                return;
            }

            clearWeatherFit();

            var gap = 12;
            var minScaleY = 0.78;
            var aRect = author.getBoundingClientRect();
            var wRect = wrap.getBoundingClientRect();
            if (!wRect.height || aRect.bottom + gap <= wRect.top) return;

            var overlap = (aRect.bottom + gap) - wRect.top;
            var scaleY = 1 - (overlap / wRect.height);
            // Small extra so author isn't flush against the bar.
            scaleY = Math.max(minScaleY, Math.min(0.98, scaleY - 0.02));
            if (scaleY >= 0.995) return;

            // Lengthen a bit as height shrinks (cap ~+10%, stay inside side insets).
            var scaleX = Math.min(1.10, 1 + (1 - scaleY) * 0.55);
            var baseW = wRect.width || 0;
            var maxLen = Math.max(0, vw - 90); // ~45px side inset each side
            if (baseW > 0 && scaleX > 1) {
                var targetW = Math.min(maxLen, baseW * scaleX);
                if (targetW > baseW + 1) {
                    wrap.style.maxWidth = Math.round(targetW) + 'px';
                    wrap.style.width = Math.round(targetW) + 'px';
                    // Width already lengthened in layout — keep X scale ≈ 1.
                    scaleX = 1;
                }
            }

            wrap.style.transformOrigin = 'center bottom';
            wrap.style.transform = 'scale(' + scaleX.toFixed(3) + ', ' + scaleY.toFixed(3) + ')';

            try {
                aRect = author.getBoundingClientRect();
                wRect = wrap.getBoundingClientRect();
                if (aRect.bottom + gap > wRect.top && scaleY > minScaleY) {
                    scaleY = Math.max(minScaleY, scaleY - 0.04);
                    wrap.style.transform = 'scale(' + scaleX.toFixed(3) + ', ' + scaleY.toFixed(3) + ')';
                }
            } catch (e) {}
        }

        function scheduleWeatherFit() {
            requestAnimationFrame(function () {
                requestAnimationFrame(fitWeatherVsQuoteAuthor);
            });
        }

        function finishWallpaperSwap(swapId, loader) {
            if (swapId !== wallpaperSwapId) return; // stale callback
            clearTimeout(wallpaperSafetyTimer);
            wallpaperBusy = false;
            if (loader) loader.classList.remove('active');
            const next = pendingWallpaperUrl;
            pendingWallpaperUrl = null;
            if (next && next.url && next.url !== displayedWallpaperUrl) {
                showWallpaper(next.url, { showLoader: !!next.showLoader });
            }
        }

        function showWallpaper(url, opts) {
            opts = opts || {};
            var showLoader = !!opts.showLoader;
            var force = !!opts.force;
            if (!url) return;
            // Same URL already painted — skip unless forced (avoids busy-lock spin).
            if (!force && url === displayedWallpaperUrl) {
                var activeParallax = document.querySelector('.wallpaper-layer.active .parallax');
                if (activeParallax && activeParallax.style && activeParallax.style.backgroundImage) {
                    return;
                }
            }
            if (wallpaperBusy) {
                pendingWallpaperUrl = { url: url, showLoader: showLoader, force: force };
                return;
            }
            wallpaperBusy = true;
            const swapId = ++wallpaperSwapId;
            const loader = document.getElementById('loader');
            if (showLoader) loader.classList.add('active');
            clearTimeout(wallpaperSafetyTimer);

            const nextBgIndex = currentBgIndex === 1 ? 2 : 1;
            const nextBgEl = document.getElementById(`bg-${nextBgIndex}`);
            const currentBgEl = document.getElementById(`bg-${currentBgIndex}`);
            const nextParallax = nextBgEl.querySelector('.parallax');
            let settled = false;

            const apply = (img) => {
                if (settled || swapId !== wallpaperSwapId) return;
                settled = true;
                displayedWallpaperUrl = url;
                if (img) applyWallpaperContrast(img);
                // Prefer css url() without quotes issues
                nextParallax.style.backgroundImage = 'url("' + String(url).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '")';
                nextBgEl.classList.remove('active', 'exiting');
                void nextBgEl.offsetWidth;
                currentBgEl.classList.add('exiting');
                currentBgEl.classList.remove('active');
                nextBgEl.classList.add('active');
                currentBgIndex = nextBgIndex;
                setTimeout(() => {
                    if (swapId !== wallpaperSwapId) return;
                    currentBgEl.classList.remove('exiting');
                    const oldParallax = currentBgEl.querySelector('.parallax');
                    if (oldParallax) oldParallax.style.backgroundImage = '';
                    finishWallpaperSwap(swapId, loader);
                }, 1650);
            };

            // If Image() hangs (common with some CDNs in WebView), still paint & unlock.
            wallpaperSafetyTimer = setTimeout(() => {
                if (swapId !== wallpaperSwapId) return;
                if (!settled) apply(null);
            }, 6000);

            const img = new Image();
            img.onload = () => apply(img);
            img.onerror = () => apply(null); // paint via CSS anyway; contrast probe optional
            img.src = url;
        }

        async function fetchWallpaper(force, attempt) {
            force = !!force;
            attempt = attempt || 0;
            const source = resolveWallpaperSource();
            const cached = getCachedWallpaper();
            // Cold start: paint cache immediately, then refresh from network.
            if (force && cached && cached !== displayedWallpaperUrl) {
                showWallpaper(cached, { showLoader: true });
            }
            // Direct image URL (or data URI) — use as-is, no JSON unwrap.
            if (looksLikeDirectImageUrl(source)) {
                setCachedWallpaper(source);
                showWallpaper(source, { showLoader: force && !cached });
                return;
            }
            try {
                // Bust HTTP cache so the 5-minute rotator actually gets a new image URL.
                const apiUrl = source + (source.indexOf('?') >= 0 ? '&' : '?') + '_ts=' + Date.now();
                const response = await safeFetch(apiUrl, { cache: 'no-store' }, 10000);
                const data = await response.json();
                if (data.code === 200 && data.data) {
                    const nextUrl = String(data.data);
                    setCachedWallpaper(nextUrl);
                    // New URL → swap. Same URL → showWallpaper no-ops (no busy-lock spin).
                    showWallpaper(nextUrl, { showLoader: force && !cached });
                    return;
                }
            } catch (error) {}
            // Only retry when we still have nothing on screen (avoid fighting the rotator).
            if (!displayedWallpaperUrl && attempt < 3) {
                setTimeout(function () { fetchWallpaper(true, attempt + 1); }, 1500 * (attempt + 1));
                return;
            }
            if (!cached && !displayedWallpaperUrl) {
                var loaderEl = document.getElementById('loader');
                if (loaderEl) loaderEl.classList.remove('active');
            }
        }

        async function fetchPoetry() {
            const wrap = document.querySelector('.poem-wrapper');
            if (!wrap) return;
            if (slotsEnabled || !isChinese()) {

        /**
         * Wider screens get a longer quote budget so we rarely inject "…".
         * Period / second-comma cuts already shorten long quotes first.
         */
        function quoteMaxChars() {
            var w = window.innerWidth || document.documentElement.clientWidth || 360;
            if (w >= 1600) return 220;
            if (w >= 1280) return 180;
            if (w >= 900) return 150;
            if (w >= 600) return 125;
            return 110;
        }

        /** Soft char cap — prefer natural wrap / CSS line-clamp over "…" on wide panels. */
        function truncateQuote(text, maxChars) {
            var s = String(text || '').replace(/\s+/g, ' ').trim();
            var limit = maxChars || quoteMaxChars();
            if (s.length <= limit) return s;
            var cut = s.slice(0, limit);
            var sp = cut.lastIndexOf(' ');
            if (sp > Math.floor(limit * 0.55)) cut = cut.slice(0, sp);
            return cut.replace(/[,\.;:!?\-—–\s]+$/, '') + '…';
        }

        /**
         * All layouts: if a sentence period appears (. or 。), drop everything after it.
         * ASCII '.' only counts when followed by whitespace (avoids U.S. / 3.14).
         */
        function cutQuoteAtFirstPeriod(text) {
            var s = String(text || '').replace(/\s+/g, ' ').trim();
            if (!s) return s;
            for (var i = 0; i < s.length; i++) {
                var ch = s.charAt(i);
                if (ch === '\u3002') {
                    return s.slice(0, i + 1).trim();
                }
                if (ch === '.' && i < s.length - 1 && /\s/.test(s.charAt(i + 1))) {
                    return s.slice(0, i + 1).trim();
                }
            }
            return s;
        }

        /**
         * Long quotes with 2+ commas: cut at the 2nd comma (, / ，),
         * replace it with '.', drop the rest — avoids "…" mid-sentence.
         */
        function cutQuoteAtSecondComma(text) {
            var s = String(text || '').replace(/\s+/g, ' ').trim();
            if (!s) return s;
            var count = 0;
            for (var i = 0; i < s.length; i++) {
                var ch = s.charAt(i);
                if (ch === ',' || ch === '\uFF0C') {
                    count++;
                    if (count === 2) {
                        // Keep a usable first clause; ignore tiny "a, b, …" stubs.
                        if (i < 16) return s;
                        return s.slice(0, i).replace(/[\s,;\uFF0C\uFF1B]+$/, '') + '.';
                    }
                }
            }
            return s;
        }

        function shapeQuoteText(text) {
            return truncateQuote(
                cutQuoteAtSecondComma(cutQuoteAtFirstPeriod(text)),
                quoteMaxChars()
            );
        }

        /** English words, or CJK character count when the line is mostly Chinese. */
        function quoteWordCount(text) {
            var s = String(text || '').replace(/\s+/g, ' ').trim();
            if (!s) return 0;
            var parts = s.split(/\s+/).filter(Boolean);
            if (parts.length === 1 && /[\u4e00-\u9fff]/.test(parts[0])) {
                return parts[0].replace(/[^\u4e00-\u9fffA-Za-z0-9]/g, '').length;
            }
            return parts.length;
        }

        /** ≤10 words after shaping → too short, discard and re-fetch. */
        function isQuoteTooShort(rawQuote) {
            return quoteWordCount(shapeQuoteText(rawQuote)) <= 10;
        }

        var quotePrefetch = null;
        var quotePrefetchPromise = null;

        async function requestRandomQuote() {
            const res = await safeFetch('https://dummyjson.com/quotes/random', {}, 8000);
            if (!res.ok) throw new Error('quote http ' + res.status);
            const data = await res.json();
            const quote = String(data.quote || '').trim();
            const author = String(data.author || '').trim();
            if (!quote) throw new Error('empty quote');
            return { quote: quote, author: author };
        }

        /** Pull next quote in the background so the 5-minute rotator feels instant. */
        function prefetchQuote() {
            if (!slotsEnabled) return;
            if (quotePrefetch || quotePrefetchPromise) return;
            quotePrefetchPromise = requestRandomQuote()
                .then(function (item) {
                    quotePrefetchPromise = null;
                    if (isQuoteTooShort(item.quote)) {
                        return requestRandomQuote().then(function (item2) {
                            quotePrefetch = item2;
                            return item2;
                        }).catch(function () {
                            quotePrefetch = item;
                            return item;
                        });
                    }
                    quotePrefetch = item;
                    return item;
                })
                .catch(function () {
                    quotePrefetchPromise = null;
                });
        }

        async function takeQuoteCandidate(allowRetry) {
            var item = null;
            if (quotePrefetch) {
                item = quotePrefetch;
                quotePrefetch = null;
            } else if (quotePrefetchPromise) {
                try {
                    await quotePrefetchPromise;
                } catch (e) {}
                quotePrefetchPromise = null;
                if (quotePrefetch) {
                    item = quotePrefetch;
                    quotePrefetch = null;
                }
            }
            if (!item) item = await requestRandomQuote();

            if (allowRetry && isQuoteTooShort(item.quote)) {
                item = await requestRandomQuote();
            }
            return item;
        }

        function applyQuote(text, author) {
            var wrap = document.getElementById('quote');
            var textEl = document.getElementById('quote-text');
            var authorEl = document.getElementById('quote-author');
            if (!wrap || !textEl || !authorEl) return;
            textEl.textContent = shapeQuoteText(text);
            authorEl.textContent = author ? ('— ' + String(author).trim()) : '';
            requestAnimationFrame(function () {
                wrap.classList.add('show');
                scheduleWeatherFit();
            });
        }

        async function fetchQuote() {
            if (!slotsEnabled) return;
            const wrap = document.getElementById('quote');
            const textEl = document.getElementById('quote-text');
            const authorEl = document.getElementById('quote-author');
            if (!wrap || !textEl || !authorEl) return;
            wrap.classList.remove('show');
            try {
                const item = await takeQuoteCandidate(true);
                try {
                    localStorage.setItem(
                        CACHE_KEY_QUOTE,
                        JSON.stringify({ quote: item.quote, author: item.author })
                    );
                } catch (e) {}
                applyQuote(item.quote, item.author);
                prefetchQuote();
            } catch (err) {
                var fallbackQuote = 'The only way to do great work is to love what you do.';
                var fallbackAuthor = 'Steve Jobs';
                try {
                    var cached = JSON.parse(localStorage.getItem(CACHE_KEY_QUOTE) || 'null');
                    if (cached && cached.quote && !isQuoteTooShort(cached.quote)) {
                        fallbackQuote = cached.quote;
                        fallbackAuthor = cached.author || 'Ava';
                    }
                } catch (e) {}
                applyQuote(fallbackQuote, fallbackAuthor);
                prefetchQuote();
            }
        }

        function normalizeSlots(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .filter((s) => s && String(s.entityId || '').trim())
                .slice(0, 4)
                .map((s) => ({
                    entityId: String(s.entityId).trim(),
                    icon: s.icon || 'mdi:home-assistant',
                    // Built-in app icon as data URI from Kotlin (no CDN webfont)
                    iconSrc: s.iconSrc || '',
                    name: s.name || '',
                    state: s.state || '--',
                }));
        }

        function slotIconHtml(s) {
            if (s.iconSrc) {
                return `<img src="${s.iconSrc}" alt="" />`;

            // Fallback glyph if native icon encode failed
            return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v4M12 16h.01"/></svg>';
        }

        /**
         * Morphologies (weather ID never top-right):
         * - corner: no weather ID, no capsules
         * - center: weather-only OR capsules-only → center clock + bottom dock
         * - dashboard: weather ID + capsules → top-left clock, right capsules, weather bottom
         */
        function syncLayoutClasses() {
            const hasCapsules = slotData.length > 0;
            // Layout follows configured weather entity ID (not only whether hours arrived).
            const hasWeather = !!weatherEntityId;
            const hasHourly = hasWeather && hourlyHours.length > 0;
            toggleClass(document.body, 'has-capsules', hasCapsules);
            toggleClass(document.body, 'has-weather', hasWeather);
            toggleClass(document.body, 'has-hourly', hasHourly);

            const isDash = slotsEnabled && hasWeather && hasCapsules;
            const isCenter = slotsEnabled && (hasWeather !== hasCapsules); // XOR
            const isCorner = slotsEnabled && !hasWeather && !hasCapsules;

            toggleClass(document.body, 'layout-dashboard', isDash);
            toggleClass(document.body, 'layout-center', isCenter);
            toggleClass(document.body, 'layout-corner', isCorner);
        }

        function renderSlots() {
            const slotsEl = document.getElementById('slots');
            if (!slotsEl) return;
            slotsEl.innerHTML = '';
            // Only configured entity IDs — empty slots stay hidden (no placeholders)
            slotData.forEach(function (s) {
                if (!s.entityId) return;
                const el = document.createElement('div');
                el.className = 'slot';
                el.setAttribute('data-entity-id', s.entityId);
                el.innerHTML =
                    '<div class="ico" aria-hidden="true">' + slotIconHtml(s) + '</div>' +
                    '<div class="text">' +
                    '<div class="name">' + escapeHtml(s.name || '') + '</div>' +
                    '<div class="state">' + escapeHtml(s.state || '--') + '</div>' +
                    '</div>';
                slotsEl.appendChild(el);
            });
            toggleClass(slotsEl, 'hidden', slotData.length === 0);
            slotsEl.setAttribute('aria-hidden', slotData.length === 0 ? 'true' : 'false');
            syncLayoutClasses();
        }

        function hideHourly() {
            hourlyHours = [];
            clearHourlyPastCache();
            const wrap = document.getElementById('hourly-wrap');
            if (wrap) {
                wrap.classList.remove('has-data');
                wrap.setAttribute('aria-hidden', 'true');
                wrap.innerHTML = '';
            }
            clearWeatherFit();
            syncLayoutClasses();
        }

        const WEATHER_ICONS = {

        function weatherIconFor(condition, opts) {
            const c = String(condition || '').toLowerCase().replace(/_/g, '-');

            // Daily forecast: always day icons (sun / cloud) — never moon / night.
            if (daily) {
                if (c.indexOf('night') >= 0) {
                    if (c.indexOf('partly') >= 0) return WEATHER_ICONS.partly;
                    if (c.indexOf('cloud') >= 0) return WEATHER_ICONS.cloud;
                    return WEATHER_ICONS.sun;
                }
                if (c === 'clearnight') return WEATHER_ICONS.sun;
            }
            // Night first — never fall through to sun via "clear" substring.
            if (c.indexOf('night') >= 0) {
                if (c.indexOf('partly') >= 0) return WEATHER_ICONS.partlyNight;
                if (c.indexOf('cloud') >= 0) return WEATHER_ICONS.cloud;
                return WEATHER_ICONS.moon;
            }
            if (c === 'clearnight') return WEATHER_ICONS.moon;
            if (c.indexOf('partly') >= 0) return WEATHER_ICONS.partly;
            if (c.indexOf('lightning') >= 0 || c.indexOf('thunder') >= 0 || c.indexOf('hail') >= 0) {
                return WEATHER_ICONS.rain;
            }
            if (c.indexOf('rain') >= 0 || c.indexOf('pour') >= 0) return WEATHER_ICONS.rain;
            if (c.indexOf('snow') >= 0) return WEATHER_ICONS.snow;
            if (c.indexOf('fog') >= 0 || c.indexOf('haze') >= 0 || c.indexOf('mist') >= 0) {
                return WEATHER_ICONS.fog;
            }
            if (c.indexOf('cloud') >= 0 || c.indexOf('wind') >= 0 || c.indexOf('exceptional') >= 0) {
                return WEATHER_ICONS.cloud;
            }
            if (c.indexOf('sunny') >= 0 || c === 'clear' || c.indexOf('sun') >= 0) {
                return WEATHER_ICONS.sun;
            }
            return WEATHER_ICONS.cloud;

        /* Day-endpoint RGB for condition tint; night depth comes from skyBrightness. */
        var SKY_DAY_RGB = {
            sunny: [142, 200, 255],
            partlycloudy: [110, 172, 217],
            cloudy: [74, 85, 102],
            fog: [92, 103, 120],
            rainy: [58, 98, 136],
            snowy: [158, 182, 212],
            windy: [90, 101, 120],
            exceptional: [92, 103, 120]
        };
