
# 本机 JDK 路径放在 ~/.gradle/gradle.properties 的 org.gradle.java.home，不进仓库。

# 本机 16GB：Kotlin 走 in-process，编译器和 Gradle 共用这块堆。ParallelGC 不会把
# 内存还给系统，堆开到 6G 会把常驻守护进程顶到换页，反而比 4G 慢。
# 若开 R8 的发布编译出现 OOM，再把这里和 workers.max 调回去。
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true

org.gradle.caching=true

org.gradle.configuration-cache=true

org.gradle.configureondemand=true

org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true

kotlin.compiler.execution.strategy=in-process
kapt.incremental.apt=true
kapt.use.worker.api=true

android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

android.enableR8.fullMode=true
android.r8.threadCount=8

# 10 核，但每个 worker 都是独立 JVM；16GB 上少两个 worker 换来不换页更划算
org.gradle.workers.max=6

systemProp.javax.net.ssl.trustStoreType=JKS
systemProp.javax.net.ssl.protocols=TLSv1.2,TLSv1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3

systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000